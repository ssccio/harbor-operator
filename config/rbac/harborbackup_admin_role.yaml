# This rule is not used by the project harbor-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over registry.gocadmium.dev.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: harbor-operator
    app.kubernetes.io/managed-by: kustomize
  name: harborbackup-admin-role
rules:
- apiGroups:
  - registry.gocadmium.dev
  resources:
  - harborbackups
  verbs:
  - '*'
- apiGroups:
  - registry.gocadmium.dev
  resources:
  - harborbackups/status
  verbs:
  - get
